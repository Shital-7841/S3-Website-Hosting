
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AWS Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f0f6ff;
            margin: 0;
            padding: 60px 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #cccccc;
        }
        h1 { color: #1769aa; }
        button {
            background: #1769aa;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to My AWS Website!</h1>
        <p>This website is hosted on Amazon S3.</p>
        <p>Project: Automated Static Website Hosting Using AWS SDK</p>
        <button onclick="showMessage()">Click Me</button>
        <p id="message"></p>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").textContent =
                "Website is working successfully!";
        }
    </script>
</body>
</html>
